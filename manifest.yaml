---
# ===================================================================
# RecruitEdge Infrastructure - Storage Account Test Manifest
# ===================================================================

resourcesToDelete:
  - template: delete-resource
    variables:
      resourceGroupName: ${RESOURCE_GROUP}
      resourceName: recruitedgedevwebsa
      resourceType: Microsoft.Storage/storageAccounts
      apiVersion: 2023-05-01

resources:
  - template: storage
    variables:
      name: "recruitedge${ENVIRONMENT}websa"
      location: eastus
      resourceGroupName:
      enableStaticWebsite: true
      accessTier: Hot
      replicationType: LRS
      allowBlobPublicAccess: true
      enableHttpsOnly: true
      softDeleteRetentionDays: 7
      tags:
        component: frontend
        purpose: "React static hosting"
        tier: ui

  - template: storage
    variables:
      name: "recruitedge2${ENVIRONMENT}websa"
      location: eastus
      resourceGroupName:
      enableStaticWebsite: true
      accessTier: Hot
      replicationType: LRS
      allowBlobPublicAccess: true
      enableHttpsOnly: true
      softDeleteRetentionDays: 7
      tags:
        component: frontend
        purpose: "React static hosting"
        tier: ui
- template: function
    variables:
      name: "recruitedge-dev-func"
      location: eastus
      resourceGroupName:"recruitedge-dev-rg"
      storageAccountName:"recruitedgedevsa"
      Runtime:"python"
      skuName:"Y1"
      appSettings:"dev"
      alwaysOn:"true"
      tags:
        purpose: "web application hosting"
        
