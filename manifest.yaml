
# ===================================================================
# RecruitEdge Infrastructure - Storage Account Test Manifest
# ===================================================================


resourcesToDelete:
  - template: delete-resource
    variables:
      resourceGroupName: ${RESOURCE_GROUP}
      resourceName: recruitedgedevwebsa
      resourceType: Microsoft.Storage/storageAccounts
      apiVersion: 2023-05-01

resources:
  - template: azure-functions
    variables:
      name: "recruitedge${ENVIRONMENT}func"
      location: eastus
      resourceGroupName: ${RESOURCE_GROUP}
      storageAccountName: "recruitedgedevsa"
      runtime: "python"         # was "Runtime"
      skuName: "Y1"
      appSettings: "dev"
      alwaysOn: true
      tags:
        purpose: "web application hosting"
