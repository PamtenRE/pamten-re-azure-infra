---
# Manifest defining Azure infrastructure components for the JobPortal platform.
# This file is environment-agnostic — all names dynamically expand using ENVIRONMENT.
# The deploy script substitutes ${ENVIRONMENT} and other env vars at runtime.

resources:
  # Storage Account (shared between functions and web apps)
  - template: storage
    variables:
      name: "jobportal${ENVIRONMENT}sa"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      tags:
        application: JobPortal
        environment: ${ENVIRONMENT}
        owner: data-platform-team

  # SQL Server + Database (password handled securely in workflow)
  - template: sql
    variables:
      serverName: "jobportal-${ENVIRONMENT}-sqlsrv"
      databaseName: "jobportal-${ENVIRONMENT}-db"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      skuName: Basic
      edition: Basic
      tags:
        application: JobPortal
        environment: ${ENVIRONMENT}

  # Java Web App (App Service)
  - template: app-service
    variables:
      name: "jobportal-${ENVIRONMENT}-java-web"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      skuName: B1
      tags:
        app: jobportal-java
        environment: ${ENVIRONMENT}

  # Python Web App (App Service)
  - template: app-service
    variables:
      name: "jobportal-${ENVIRONMENT}-python-web"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      skuName: B1
      tags:
        app: jobportal-python
        environment: ${ENVIRONMENT}

  # Function Apps
  - template: azure-functions
    variables:
      name: "jobportal-${ENVIRONMENT}-func-java"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      storageAccountName: "jobportal${ENVIRONMENT}sa"
      runtime: java
      tags:
        app: func-java
        environment: ${ENVIRONMENT}

  - template: azure-functions
    variables:
      name: "jobportal-${ENVIRONMENT}-func-python"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      storageAccountName: "jobportal${ENVIRONMENT}sa"
      runtime: python
      tags:
        app: func-python
        environment: ${ENVIRONMENT}

  # Static website (React Frontend)
  - template: static-web
    variables:
      name: "jobportal${ENVIRONMENT}websa"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      tags:
        app: jobportal-ui
        environment: ${ENVIRONMENT}

  # API Management Gateway
  - template: api-management
    variables:
      name: "jobportal-${ENVIRONMENT}-api"
      location: eastus
      resourceGroupName: "jobportal-${ENVIRONMENT}-rg"
      skuName: Consumption_0
      tags:
        app: jobportal-api
        environment: ${ENVIRONMENT}

  # Azure AD B2C Tenant (manual provisioning placeholder)
  - template: azure-ad-b2c
    variables:
      tenantName: "jobportal${ENVIRONMENT}b2c"
      displayName: "JobPortal ${ENVIRONMENT}"
      countryCode: unitedstates
      tags:
        app: identity
        environment: ${ENVIRONMENT}
