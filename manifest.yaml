---
# ===================================================================
#  RecruitEdge Platform - Unified Infrastructure Manifest
# ===================================================================
#  Purpose:
#    - Defines all Azure infrastructure components for RecruitEdge
#    - Works across all environments (dev, stage, prod)
#    - Inherits global tags automatically from tags.yaml
#    - Allows per-resource tag overrides
#
#  Deployment Example:
#    export ENVIRONMENT=dev
#    python scripts/deploy_from_manifest.py --manifest manifest.yaml --env "$ENVIRONMENT"
#
#  Notes:
#    - Do not store secrets or credentials in this manifest.
#    - Secrets (SQL creds, SPNs, etc.) are injected via environment secrets.
# ===================================================================

resources:

  # --------------------------------------------------------------
  # Storage Account - shared between App Services, Functions, Static Web
  # --------------------------------------------------------------
  - template: storage
    variables:
      name: "recruitedge${ENVIRONMENT}sa"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      tags:
        component: storage
        purpose: "Shared platform storage"

  # --------------------------------------------------------------
  # SQL Server & Database
  # --------------------------------------------------------------
  - template: sql
    variables:
      serverName: "recruitedge-${ENVIRONMENT}-sqlsrv"
      databaseName: "recruitedge-${ENVIRONMENT}-db"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      skuName: Basic
      edition: Basic
      tags:
        component: database
        tier: backend

  # --------------------------------------------------------------
  # App Services - Java Backend (for ATS logic, APIs)
  # --------------------------------------------------------------
  - template: app-service
    variables:
      name: "recruitedge-${ENVIRONMENT}-java-api"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      skuName: B1
      tags:
        app: recruit-edge-api
        runtime: java
        tier: backend

  # --------------------------------------------------------------
  # App Services - Python Backend (for ML/Matching Engine)
  # --------------------------------------------------------------
  - template: app-service
    variables:
      name: "recruitedge-${ENVIRONMENT}-python-api"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      skuName: B1
      tags:
        app: recruit-edge-ml
        runtime: python
        tier: backend

  # --------------------------------------------------------------
  # Azure Functions - Python (for Resume Parsing, Notifications)
  # --------------------------------------------------------------
  - template: azure-functions
    variables:
      name: "recruitedge-${ENVIRONMENT}-func-python"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      storageAccountName: "recruitedge${ENVIRONMENT}sa"
      runtime: python
      tags:
        component: resume-parser
        tier: function

  # --------------------------------------------------------------
  # Azure Functions - Node (for Webhooks or lightweight handlers)
  # --------------------------------------------------------------
  - template: azure-functions
    variables:
      name: "recruitedge-${ENVIRONMENT}-func-node"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      storageAccountName: "recruitedge${ENVIRONMENT}sa"
      runtime: node
      tags:
        component: webhook-engine
        tier: function

  # --------------------------------------------------------------
  # Static Website - React Frontend (RecruitEdge Web Portal)
  # --------------------------------------------------------------
  - template: static-web
    variables:
      name: "recruitedge${ENVIRONMENT}websa"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      tags:
        app: recruit-edge-ui
        runtime: react
        tier: frontend

  # --------------------------------------------------------------
  # API Management - Secure gateway for internal/external APIs
  # --------------------------------------------------------------
  - template: api-management
    variables:
      name: "recruitedge-${ENVIRONMENT}-api"
      location: eastus
      resourceGroupName: "recruitedge-${ENVIRONMENT}-rg"
      skuName: Consumption_0
      tags:
        component: apim-gateway
        tier: middleware

  # --------------------------------------------------------------
  # Azure AD B2C - Authentication & Identity (placeholder)
  # --------------------------------------------------------------
  - template: azure-ad-b2c
    variables:
      tenantName: "recruitedge${ENVIRONMENT}b2c"
      displayName: "RecruitEdge ${ENVIRONMENT}"
      countryCode: unitedstates
      tags:
        component: identity
        tier: security
