---
# ===================================================================
# RecruitEdge Infrastructure - Storage Account Test Manifest
# ===================================================================

resources:
  - template: delete-resource
    variables:
      resourceGroupName: ${RESOURCE_GROUP}
      resourceName: recruitedgedevwebsa
      resourceType: Microsoft.Storage/storageAccounts
      apiVersion: 2023-05-01

  - template: storage
    variables:
      name: "recruitedge${ENVIRONMENT}websa"
      location: eastus
      resourceGroupName: 
      enableStaticWebsite: true
      accessTier: Hot
      replicationType: LRS
      allowBlobPublicAccess: true
      enableHttpsOnly: true
      softDeleteRetentionDays: 7
      tags:
        component: frontend
        purpose: "React static hosting"
        tier: ui
