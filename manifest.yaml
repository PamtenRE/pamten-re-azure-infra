# manifest.yaml
  - template: user-assigned-identity
    variables:
      name: "pamten-re-${ENVIRONMENT}"
      location: eastus2
      resourceGroupName: ${RESOURCE_GROUP}
      tags:
        component: identity
        environment: ${ENVIRONMENT}


  - template: azure-functions
    variables:
      name: "recruitedge2-${ENVIRONMENT}-func"
      location: eastus
      resourceGroupName: ${RESOURCE_GROUP}
      storageAccountName: "recruitedge2${ENVIRONMENT}websa"
      runtime: python
      skuName: Y1          # Consumption plan
      alwaysOn: false      # Only for Premium/Dedicated plans
      userAssignedIdentityName: "pamten-re-${ENVIRONMENT}"  # Leave blank for system-assigned identity
      workspaceResourceId: ""        # Optionally link Log Analytics workspace
      tags:
        component: backend
        purpose: "RecruitEdge Function API"
        tier: backend
        environment: ${ENVIRONMENT}
      appSettings:
        - name: "APP_ENV"
          value: "${ENVIRONMENT}"
        - name: "FRONTEND_URL"
          value: "https://recruitedge2${ENVIRONMENT}web.z13.web.core.windows.net"
        - name: "WEBSITE_RUN_FROM_PACKAGE"
          value: "1"
      roleAssignments:
        - roleDefinitionId: "/subscriptions/${SUBSCRIPTION_ID}/providers/Microsoft.Authorization/roleDefinitions/ba92f5b4-2d11-453d-a403-e96b0029c9fe"
          scope: "/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Storage/storageAccounts/recruitedge2${ENVIRONMENT}websa"


  - template: app-service
    variables:
      name: "recruitedge2-${ENVIRONMENT}-flask"
      location: eastus
      resourceGroupName: ${RESOURCE_GROUP}
      skuName: "B1"
      runtime: "python"
      alwaysOn: true
      tags:
        component: backend
        purpose: "RecruitEdge Flask API"
        tier: backend
        environment: ${ENVIRONMENT}
      appSettings:
        APP_ENV: ${ENVIRONMENT}
        FLASK_ENV: ${ENVIRONMENT}
        FLASK_APP: "app.py"
        SCM_DO_BUILD_DURING_DEPLOYMENT: "true"
        WEBSITE_RUN_FROM_PACKAGE: "1"
        PYTHON_VERSION: "3.10"
        FUNCTIONS_WORKER_RUNTIME: "python"
        LOG_LEVEL: "INFO"
        DB_HOST: "recruitedge-${ENVIRONMENT}-db.database.windows.net"
        DB_NAME: "recruitedge"
        DB_USER: "adminuser"
        DB_PASS: "changeme"

  - template: app-service
    variables:
      name: "recruitedge2-${ENVIRONMENT}-java"
      location: eastus
      resourceGroupName: ${RESOURCE_GROUP}
      skuName: "B1"
      runtime: "java"
      alwaysOn: true
      tags:
        component: backend
        purpose: "RecruitEdge Java API (Spring Boot / Maven)"
        tier: backend
        environment: ${ENVIRONMENT}
      appSettings:
        APP_ENV: ${ENVIRONMENT}
        JAVA_VERSION: "17"
        MAVEN_OPTS: "-Xmx1024m"
        SCM_DO_BUILD_DURING_DEPLOYMENT: "true"
        WEBSITE_RUN_FROM_PACKAGE: "1"
        WEBSITES_CONTAINER_START_TIME_LIMIT: "1800"
        LOG_LEVEL: "INFO"
        DB_HOST: "recruitedge-${ENVIRONMENT}-db.database.windows.net"
        DB_NAME: "recruitedge"
        DB_USER: "adminuser"
        DB_PASS: "changeme"
