---
# Environment-specific resource configurations
#
# GitHub Actions integration:
# - Set ENVIRONMENT (for example, 'dev' or 'prod') in your workflow environment.
# - The deploy script will substitute any ${VAR} placeholders with environment variables
#   and will select the manifest section that matches the target environment.
#
# Example (GitHub Actions snippet):
# env:
#   ENVIRONMENT: dev
#
# Then call the deploy script with the environment value (the script also accepts --env):
# python scripts/deploy_from_manifest.py --manifest manifest.yaml --env "$ENVIRONMENT"
#
# Top-level jobs section (informational):
jobs:
  deploy:
    description: "Deploy resources for the environment selected by the ENVIRONMENT env var set in GitHub Actions."
    envVar: ENVIRONMENT
    usage: "Set ENVIRONMENT=dev or ENVIRONMENT=prod in the workflow. The deployment script will use this value to pick the manifest section."

# You can use ${VAR} placeholders inside resource variables. The deploy script substitutes them
# using environment variables (for example ${ENVIRONMENT}, ${SQL_ADMIN_USER}, ${SQL_ADMIN_PWD}).
# Example dynamic naming (commented):
#   resourceGroupName: jobportal-${ENVIRONMENT}-rg
#   name: jobportal-${ENVIRONMENT}-web

dev:
  resources:
    # Storage Account
    - template: storage
      variables:
        name: jobportaldevsa  # Must be globally unique, no hyphens
        location: eastus
        resourceGroupName: jobportal-dev-rg

    # SQL Server and Database
    - template: sql
      variables:
        serverName: jobportal-dev-sqlsrv
        databaseName: jobportal-dev-db
        location: eastus
        resourceGroupName: jobportal-dev-rg
        administratorLogin: ${SQL_ADMIN_USER}
        administratorPassword: ${SQL_ADMIN_PWD}
        skuName: Basic
        edition: Basic

    # App Service
    - template: app-service
      variables:
        name: jobportal-dev-web
        location: eastus
        resourceGroupName: jobportal-dev-rg
        skuName: B1
        tags:
          CostCenter: development

    # Azure Functions
    - template: azure-functions
      variables:
        name: jobportal-dev-func
        location: eastus
        resourceGroupName: jobportal-dev-rg
        storageAccountName: jobportaldevsa
        runtime: java

prod:
  resources:
    # Storage Account
    - template: storage
      variables:
        name: jobportalprodsa  # Must be globally unique, no hyphens
        location: eastus
        resourceGroupName: jobportal-prod-rg

    # SQL Server and Database
    - template: sql
      variables:
        serverName: jobportal-prod-sqlsrv
        databaseName: jobportal-prod-db
        location: eastus
        resourceGroupName: jobportal-prod-rg
        administratorLogin: ${SQL_ADMIN_USER}
        administratorPassword: ${SQL_ADMIN_PWD}
        skuName: S0
        edition: Standard

    # App Service
    - template: app-service
      variables:
        name: jobportal-prod-web
        location: eastus
        resourceGroupName: jobportal-prod-rg
        skuName: S1
        tags:
          CostCenter: production

    # Azure Functions
    - template: azure-functions
      variables:
        name: jobportal-prod-func
        location: eastus
        resourceGroupName: jobportal-prod-rg
        storageAccountName: jobportalprodsa
        runtime: java