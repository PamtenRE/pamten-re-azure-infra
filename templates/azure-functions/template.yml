name: Deploy Azure Function App

# This reusable workflow deploys an Azure Function App using a Bicep template.
# It expects a set of inputs that define the app name, location, storage account, runtime,
# and resource group.  The calling workflow must provide Azure credentials via secrets.

on:
  workflow_call:
    inputs:
      function_name:
        required: true
        type: string
        description: 'Name of the Function App'
      location:
        required: true
        type: string
        description: 'Azure location'
      storage_account_name:
        required: true
        type: string
        description: 'Existing storage account name for the Function runtime'
      runtime:
        required: true
        type: string
        description: 'Function runtime (e.g. java, python, dotnet, node)'
      resource_group:
        required: true
        type: string
        description: 'Resource group to deploy into'
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
    # Additional secrets such as storage account keys can be passed through

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App Bicep template
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ inputs.resource_group }}
          template: ${{ github.workspace }}/infra/templates/azure-functions/template.bicep
          parameters: |
            name=${{ inputs.function_name }}
            location=${{ inputs.location }}
            storageAccountName=${{ inputs.storage_account_name }}
            runtime=${{ inputs.runtime }}
          failOnStdErr: false