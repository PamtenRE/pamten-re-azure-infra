dev:
  resources:
    - template: azure-functions
      variables:
        name: jobportal-dev-func
        location: eastus
        storageAccountName: jobportaldevsa
        runtime: java
        resourceGroupName: jobportal-dev-rg
        # Tags are applied centrally via tags.yaml.  You can still add
        # resource‑specific tags here to override values defined in tags.yaml.
    - template: storage
      variables:
        name: jobportaldevsa
        location: eastus
        skuName: Standard_LRS
        # Tags are applied centrally via tags.yaml.
    - template: app-service
      variables:
        name: jobportal-dev-web
        location: eastus
        resourceGroupName: jobportal-dev-rg
        skuName: B1
        # Tags are applied centrally via tags.yaml.
    - template: sql
      variables:
        location: eastus
        serverName: jobportal-dev-sqlsrv
        databaseName: jobportal-dev-db
        administratorLogin: "${SQL_ADMIN_USER}"
        administratorPassword: "${SQL_ADMIN_PWD}"
        skuName: Basic
        edition: Basic
        # Tags are applied centrally via tags.yaml.
prod:
  resources:
    - template: azure-functions
      variables:
        name: jobportal-prod-func
        location: eastus2
        storageAccountName: jobportalprodsa
        runtime: java
        resourceGroupName: jobportal-prod-rg
        # Tags are applied centrally via tags.yaml.
    - template: storage
      variables:
        name: jobportalprodsa
        location: eastus2
        skuName: Standard_GRS
        # Tags are applied centrally via tags.yaml.
    - template: app-service
      variables:
        name: jobportal-prod-web
        location: eastus2
        resourceGroupName: jobportal-prod-rg
        skuName: S1
        # Tags are applied centrally via tags.yaml.
    - template: sql
      variables:
        location: eastus2
        serverName: jobportal-prod-sqlsrv
        databaseName: jobportal-prod-db
        administratorLogin: "${SQL_ADMIN_USER}"
        administratorPassword: "${SQL_ADMIN_PWD}"
        skuName: S0
        edition: Standard
        # Tags are applied centrally via tags.yaml.